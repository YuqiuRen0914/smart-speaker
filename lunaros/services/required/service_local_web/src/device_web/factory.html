<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>本机工厂检查 · LunarOS</title>
  <!-- FACTORY_STYLES -->
</head>
<body>
  <div class="shell factory-shell">
    <header class="factory-header">
      <div><a class="back-link" href="/">← 返回 LunarOS</a><h1>本机工厂检查</h1><p id="productName" class="help">正在连接设备…</p></div>
      <button id="refresh" type="button">刷新</button>
    </header>
    <main>
      <div id="message" class="factory-message" role="status" aria-live="polite" hidden></div>
      <section class="factory-overview" aria-labelledby="sessionTitle">
        <div><h2 id="sessionTitle">检查会话</h2><p id="summary" class="help">正在读取检查清单…</p></div>
        <div class="actions"><button id="enter" class="primary" type="button" hidden>开始检查</button><button id="exit" type="button" hidden>结束检查</button></div>
      </section>
      <section id="currentPanel" class="factory-current" aria-labelledby="currentTitle" hidden>
        <div><span class="eyebrow">当前项目</span><h2 id="currentTitle"></h2><p id="currentHelp" class="help"></p></div>
        <div class="actions"><button id="currentPass" type="button">通过</button><button id="currentFail" type="button">失败</button><button id="currentReset" type="button">取消本项</button></div>
      </section>
      <nav class="factory-tabs" aria-label="检查类别"><button id="hardwareTab" type="button" aria-pressed="true">硬件检查 <span id="hardwareCount"></span></button><button id="softwareTab" type="button" aria-pressed="false">应用检查 <span id="softwareCount"></span></button></nav>
      <section id="hardwarePanel" aria-labelledby="hardwareTitle">
        <div class="section-title"><h2 id="hardwareTitle">硬件检查</h2></div>
        <p class="help">由设备模块提供。启动后查看屏幕、触控或声音，再在上方确认结果。</p>
        <div id="hardwareList" class="factory-list"></div>
      </section>
      <section id="softwarePanel" aria-labelledby="softwareTitle" hidden>
        <div class="section-title"><h2 id="softwareTitle">应用检查</h2></div>
        <p class="help">由各应用提供。选择下一项时，未确认的应用检查会自动取消；已确认结果会保留。</p>
        <div id="softwareList" class="factory-list"></div>
      </section>
    </main>
  </div>
  <script src="/device-client.js"></script>
  <!-- FACTORY_SCRIPT -->
</body>
</html>
